# Kõik väärtused tulevad keskkonnamuutujatest. Vaikeväärtused vastavad labori hostinimedele.
spring.application.name=labori-seis
server.port=${PORT:8080}

app.version=@project.version@
app.build-time=@build.timestamp@
app.git-sha=${GIT_SHA:unknown}
app.teacher-token=${TEACHER_TOKEN:}

# db01
spring.datasource.url=jdbc:mariadb://${DB_HOST:db01}:${DB_PORT:3306}/${DB_NAME:labseis}
spring.datasource.username=${DB_USER:labseis}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=-1

# mc01
app.memcached.host=${MEMCACHED_HOST:mc01}
app.memcached.port=${MEMCACHED_PORT:11211}

# rmq01
spring.rabbitmq.host=${RABBITMQ_HOST:rmq01}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:labseis}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.connection-timeout=3s
# Tarbija: üks sõnum korraga. Kui andmebaas ei vasta, proovitakse 10 korda (1 s … 30 s), siis pannakse sõnum
# järjekorda tagasi. Vigane sõnum visatakse ära (queue/ResultRecoverer.java).
# Kubernetes'is eraldi tarbija-Deployment: veebikoopiatel SPRING_RABBITMQ_LISTENER_SIMPLE_AUTOSTARTUP=false
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.default-requeue-rejected=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=10
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=30s

spring.thymeleaf.cache=true
